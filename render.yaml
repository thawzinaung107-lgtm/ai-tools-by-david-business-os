services:
  - type: web
    name: atd-api
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @atd/api build
    preDeployCommand: pnpm --filter @atd/api db:migrate
    startCommand: pnpm --filter @atd/api start
    healthCheckPath: /ready
    plan: starter
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://atd-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: atd-postgres
          property: connectionString
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_ACCESS_TOKEN
        sync: false

  - type: worker
    name: atd-worker
    runtime: node
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @atd/worker build
    startCommand: pnpm --filter @atd/worker start
    plan: starter
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atd-postgres
          property: connectionString

  - type: cron
    name: atd-cron
    runtime: node
    rootDir: .
    schedule: "*/15 * * * *"
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @atd/worker build
    startCommand: pnpm --filter @atd/worker cron
    plan: starter
    region: singapore
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: atd-postgres
          property: connectionString

  - type: web
    name: atd-web
    runtime: static
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile=false && pnpm --filter @atd/web build
    staticPublishPath: apps/web/dist
    buildFilter:
      paths:
        - apps/web/**
        - package.json
        - pnpm-workspace.yaml
        - pnpm-lock.yaml
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: VITE_API_BASE_URL
        value: https://atd-api-aw7o.onrender.com

databases:
  - name: atd-postgres
    plan: basic-256mb
    region: singapore
